<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="tt dd">
<title id="tt">T-CID-09 Meu perfil</title>
<desc id="dd">Dados do próprio usuário (GET /me), edição de nome, e-mail e fuso horário (PATCH /me), entrada para alterar senha (PATCH /me/senha), foto (POST /me/avatar) e saída da conta.</desc>
