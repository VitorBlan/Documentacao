<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="tt dd">
<title id="tt">T-CID-03 Entrada por QR Code</title>
<desc id="dd">Fila presencial: leitura do QR Code impresso na fila (ou digitação do código) antes de emitir a senha. Envia POST /filas/:filaId/senhas com qrCode, validado por QrCodeService.</desc>
<style>
.h{font-size:20px;font-weight:700}
.h18{font-size:18px;font-weight:700}
.b{font-weight:700}
.l{font-size:13px;fill:#4b5563}
.s{font-size:12px;fill:#4b5563}
.m{font-family:monospace;font-size:12px;fill:#4b5563}
.c{text-anchor:middle}
.bp{font-size:16px;font-weight:700;fill:#ffffff;text-anchor:middle}
.bs{font-size:16px;font-weight:700;fill:#111827;text-anchor:middle}
</style>
<rect width="390" height="844" fill="#ffffff"/>
<g font-family="sans-serif" font-size="15" fill="#111827">
<rect x="0" y="0" width="390" height="56" fill="#f3f4f6"/>
<line x1="0" y1="56" x2="390" y2="56" stroke="#d1d5db"/>
<path d="M26 18 L16 28 L26 38" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="35" class="h18">Escanear QR Code</text>
<text x="20" y="88" class="b">Fila: Retirada de documentos</text>
<text x="20" y="110" class="l">Aponte a câmera para o QR Code impresso na fila.</text>
<rect x="40" y="128" width="310" height="300" rx="16" fill="#374151"/>
<path d="M40 152 V128 H64" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<path d="M326 128 H350 V152" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<path d="M40 404 V428 H64" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<path d="M326 428 H350 V404" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<rect x="115" y="178" width="160" height="160" rx="6" fill="#ffffff"/>
<rect x="125" y="188" width="40" height="40" fill="#111827"/>
<rect x="133" y="196" width="24" height="24" fill="#ffffff"/>
<rect x="137" y="200" width="16" height="16" fill="#111827"/>
<rect x="225" y="188" width="40" height="40" fill="#111827"/>
<rect x="233" y="196" width="24" height="24" fill="#ffffff"/>
<rect x="237" y="200" width="16" height="16" fill="#111827"/>
<rect x="125" y="288" width="40" height="40" fill="#111827"/>
<rect x="133" y="296" width="24" height="24" fill="#ffffff"/>
<rect x="137" y="300" width="16" height="16" fill="#111827"/>
<rect x="185" y="188" width="12" height="12" fill="#111827"/>
<rect x="205" y="208" width="12" height="12" fill="#111827"/>
<rect x="185" y="228" width="12" height="12" fill="#111827"/>
<rect x="225" y="248" width="12" height="12" fill="#111827"/>
<rect x="245" y="268" width="12" height="12" fill="#111827"/>
<rect x="205" y="288" width="12" height="12" fill="#111827"/>
<rect x="185" y="308" width="12" height="12" fill="#111827"/>
<rect x="265" y="228" width="12" height="12" fill="#111827"/>
<rect x="245" y="308" width="12" height="12" fill="#111827"/>
<text x="195" y="456" class="l c">Não consegue escanear?</text>
<text x="20" y="486" class="l">Código do QR Code</text>
<rect x="20" y="494" width="350" height="48" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="36" y="523" class="m" style="font-size:14px">Ex.: QR-NRT-0142</text>
<text x="20" y="566" class="l">O código confirma sua presença na fila.</text>
<text x="20" y="586" class="l">Ele é exigido somente em filas presenciais.</text>
<text x="195" y="690" class="l c">Digite o código para continuar.</text>
<rect x="20" y="716" width="350" height="48" rx="8" fill="#d1d5db"/>
<text x="195" y="746" class="bp" style="fill:#374151">Confirmar e emitir senha</text>
</g>
</svg>
