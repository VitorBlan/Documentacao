<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="tt dd">
<title id="tt">T-CID-08 Solicitar cadastro de instituição</title>
<desc id="dd">Formulário para o cidadão solicitar o cadastro de uma instituição. Campos correspondem ao modelo Instituicao (nome, cnpj, email, telefone, responsavel, endereco, descricao). Envia POST /instituicoes/solicitar; a instituição nasce PENDENTE.</desc>
<style>
.h{font-size:20px;font-weight:700}
.h18{font-size:18px;font-weight:700}
.b{font-weight:700}
.l{font-size:13px;fill:#4b5563}
.s{font-size:12px;fill:#4b5563}
.m{font-family:monospace;font-size:12px;fill:#4b5563}
.c{text-anchor:middle}
.bp{font-size:16px;font-weight:700;fill:#ffffff;text-anchor:middle}
.bs{font-size:16px;font-weight:700;fill:#111827;text-anchor:middle}
</style>
<rect width="390" height="844" fill="#ffffff"/>
<g font-family="sans-serif" font-size="15" fill="#111827">
<rect x="0" y="0" width="390" height="56" fill="#f3f4f6"/>
<line x1="0" y1="56" x2="390" y2="56" stroke="#d1d5db"/>
<path d="M26 18 L16 28 L26 38" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="35" class="h18">Solicitar cadastro</text>
<text x="20" y="76" class="l">Nome da instituição</text>
<rect x="20" y="84" width="350" height="44" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="36" y="112" fill="#6b7280">Ex.: Cartório do Centro</text>

<text x="20" y="144" class="l">CNPJ</text>
<rect x="20" y="152" width="350" height="44" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="36" y="180" fill="#6b7280" style="font-family:monospace;font-size:14px">00.000.000/0000-00</text>

<text x="20" y="212" class="l">E-mail institucional</text>
<rect x="20" y="220" width="350" height="44" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="36" y="248" fill="#6b7280">contato@cartorio.exemplo.br</text>

<text x="20" y="280" class="l">Telefone</text>
<rect x="20" y="288" width="350" height="44" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="36" y="316" fill="#6b7280">(92) 90000-0000</text>

<text x="20" y="348" class="l">Responsável</text>
<rect x="20" y="356" width="350" height="44" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="36" y="384" fill="#6b7280">Nome de quem responde pela instituição</text>

<text x="20" y="416" class="l">Endereço</text>
<rect x="20" y="424" width="350" height="80" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="36" y="450" fill="#6b7280">Rua, número, bairro e cidade</text>

<text x="20" y="520" class="l">Descrição dos serviços</text>
<rect x="20" y="528" width="350" height="72" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="36" y="554" fill="#6b7280">Quais atendimentos a instituição oferece.</text>

<text x="20" y="626" class="l">Fica pendente até a análise da plataforma.</text>
<rect x="20" y="716" width="350" height="48" rx="8" fill="#2563eb"/>
<text x="195" y="746" class="bp">Enviar solicitação</text>
</g>
</svg>
