<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="tt dd">
<title id="tt">T-CID-02 Fila e emissão de senha online</title>
<desc id="dd">Confirmação da emissão de senha online ou híbrida: resumo da fila, escolha de prioridade (somente as habilitadas na fila) e ação principal. Envia POST /filas/:filaId/senhas.</desc>
<style>
.h{font-size:20px;font-weight:700}
.h18{font-size:18px;font-weight:700}
.b{font-weight:700}
.l{font-size:13px;fill:#4b5563}
.s{font-size:12px;fill:#4b5563}
.m{font-family:monospace;font-size:12px;fill:#4b5563}
.c{text-anchor:middle}
.bp{font-size:16px;font-weight:700;fill:#ffffff;text-anchor:middle}
.bs{font-size:16px;font-weight:700;fill:#111827;text-anchor:middle}
</style>
<rect width="390" height="844" fill="#ffffff"/>
<g font-family="sans-serif" font-size="15" fill="#111827">
<rect x="0" y="0" width="390" height="56" fill="#f3f4f6"/>
<line x1="0" y1="56" x2="390" y2="56" stroke="#d1d5db"/>
<path d="M26 18 L16 28 L26 38" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="35" class="h18">Emitir senha</text>
<rect x="20" y="72" width="350" height="140" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
<text x="36" y="96" class="l">Fila</text>
<text x="36" y="118" class="b">Atendimento ao contribuinte</text>
<text x="36" y="140" class="l">Central de Atendimento Norte · Online</text>
<line x1="36" y1="156" x2="354" y2="156" stroke="#e5e7eb"/>
<text x="36" y="184" class="b" style="font-size:18px">12</text>
<text x="36" y="204" class="l">aguardando</text>
<text x="200" y="184" class="b" style="font-size:18px">2</text>
<text x="200" y="204" class="l">em atendimento</text>

<text x="20" y="244" class="b">Prioridade</text>
<rect x="20" y="256" width="350" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<circle cx="44" cy="284" r="9" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="44" cy="284" r="5" fill="#2563eb"/>
<text x="64" y="280" class="b">Normal</text>
<text x="64" y="300" class="l">Ordem de chegada, sem prioridade.</text>

<rect x="20" y="324" width="350" height="56" rx="10" fill="#ffffff" stroke="#6b7280"/>
<circle cx="44" cy="352" r="9" fill="none" stroke="#6b7280" stroke-width="2"/>
<text x="64" y="348" class="b">Prioritário</text>
<text x="64" y="368" class="l">Disponível nesta fila.</text>

<rect x="20" y="396" width="350" height="64" rx="10" fill="#f3f4f6"/>
<text x="36" y="422">Sua senha tem número e posição na fila.</text>
<text x="36" y="444" class="l">Acompanhe tudo em Minha senha.</text>

<rect x="20" y="476" width="350" height="56" rx="10" fill="#ffffff" stroke="#d1d5db"/>
<text x="36" y="500" class="l">Você pode ter só uma senha ativa por fila.</text>
<text x="36" y="518" class="l">Se já tiver uma, veja a senha existente.</text>

<rect x="20" y="716" width="350" height="48" rx="8" fill="#2563eb"/>
