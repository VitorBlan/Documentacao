<title id="tt">T-CID-04 Minha senha: status, posição e cancelamento</title>
<desc id="dd">Acompanhamento da senha do cidadão: número, posição, quantidade aguardando, fila e ação de cancelar (só enquanto AGUARDANDO). Dados de GET /senhas/:id e GET /filas/:id/senhas/contagem.</desc>
