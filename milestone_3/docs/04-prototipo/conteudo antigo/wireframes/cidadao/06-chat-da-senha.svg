<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="tt dd">
<title id="tt">T-CID-06 Chat da senha</title>
<desc id="dd">Conversa do cidadão com o operador durante o atendimento. Só existe com a senha EM_ATENDIMENTO (409 caso contrário). Envia GET e POST /senhas/:senhaId/chat; cada mensagem guarda o nome do autor.</desc>
<style>
.h{font-size:20px;font-weight:700}
.h18{font-size:18px;font-weight:700}
.b{font-weight:700}
.l{font-size:13px;fill:#4b5563}
.s{font-size:12px;fill:#4b5563}
.m{font-family:monospace;font-size:12px;fill:#4b5563}
.c{text-anchor:middle}
.bp{font-size:16px;font-weight:700;fill:#ffffff;text-anchor:middle}
.bs{font-size:16px;font-weight:700;fill:#111827;text-anchor:middle}
</style>
<rect width="390" height="844" fill="#ffffff"/>
<g font-family="sans-serif" font-size="15" fill="#111827">
<rect x="0" y="0" width="390" height="56" fill="#f3f4f6"/>
<line x1="0" y1="56" x2="390" y2="56" stroke="#d1d5db"/>
<path d="M26 18 L16 28 L26 38" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="35" class="h18">Chat da senha</text>
<rect x="0" y="56" width="390" height="52" fill="#f9fafb"/>
<text x="20" y="78" class="b">Senha 42 · Mesa 3</text>
<text x="20" y="98" class="l">Atendente: Carla Lopes</text>
<line x1="0" y1="108" x2="390" y2="108" stroke="#e5e7eb"/>

<rect x="20" y="128" width="260" height="56" rx="14" fill="#f3f4f6"/>
<text x="36" y="152">Bom dia! Pode me mostrar</text>
<text x="36" y="172">o documento com foto?</text>
<text x="20" y="200" class="s">Carla Lopes · 09:22</text>

<rect x="110" y="212" width="260" height="44" rx="14" fill="#2563eb"/>
<text x="126" y="239" fill="#ffffff">Claro, um momento.</text>
<text x="370" y="272" class="s" text-anchor="end">Você · 09:23</text>

<rect x="20" y="284" width="300" height="56" rx="14" fill="#f3f4f6"/>
<text x="36" y="308">Obrigada. Falta apenas a assinatura</text>
<text x="36" y="328">no formulário de retirada.</text>
<text x="20" y="356" class="s">Carla Lopes · 09:25</text>

<rect x="170" y="372" width="200" height="44" rx="14" fill="#2563eb"/>
<text x="186" y="399" fill="#ffffff">Assinado. Obrigada!</text>
<text x="370" y="432" class="s" text-anchor="end">Você · 09:26</text>

<text x="195" y="480" class="l c">Conversa encerra ao finalizar o atendimento.</text>

<rect x="0" y="716" width="390" height="64" fill="#f3f4f6"/>
<line x1="0" y1="716" x2="390" y2="716" stroke="#d1d5db"/>
<rect x="20" y="730" width="290" height="40" rx="20" fill="#ffffff" stroke="#6b7280"/>
<text x="36" y="755" fill="#6b7280">Escreva uma mensagem</text>
<circle cx="340" cy="750" r="20" fill="#2563eb"/>
<path d="M332 750 H348 M342 744 L348 750 L342 756" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
