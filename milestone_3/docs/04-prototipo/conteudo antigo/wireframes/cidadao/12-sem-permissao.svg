<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="tt dd">
<title id="tt">T-CID-12 Sem permissão</title>
<desc id="dd">Estado de acesso negado (HTTP 403) ao abrir senha de outro usuário ou de outra instituição. Mostra ações de saída e anotações sobre sessão expirada (401) e câmera negada.</desc>
<style>
.h{font-size:20px;font-weight:700}
.h18{font-size:18px;font-weight:700}
.b{font-weight:700}
.l{font-size:13px;fill:#4b5563}
.s{font-size:12px;fill:#4b5563}
.m{font-family:monospace;font-size:12px;fill:#4b5563}
.c{text-anchor:middle}
.bp{font-size:16px;font-weight:700;fill:#ffffff;text-anchor:middle}
.bs{font-size:16px;font-weight:700;fill:#111827;text-anchor:middle}
</style>
<rect width="390" height="844" fill="#ffffff"/>
<g font-family="sans-serif" font-size="15" fill="#111827">
<rect x="0" y="0" width="390" height="56" fill="#f3f4f6"/>
<line x1="0" y1="56" x2="390" y2="56" stroke="#d1d5db"/>
<path d="M26 18 L16 28 L26 38" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="35" class="h18">Minha senha</text>
<circle cx="195" cy="196" r="44" fill="#f3f4f6" stroke="#9ca3af"/>
<path d="M186 196 V186 A9 9 0 0 1 204 186 V196" fill="none" stroke="#6b7280" stroke-width="3"/>
<rect x="180" y="196" width="30" height="24" rx="4" fill="#6b7280"/>
<text x="195" y="282" class="h18 c">Você não tem acesso a esta senha</text>
<text x="195" y="310" class="c" fill="#4b5563">Esta senha pertence a outra conta.</text>
<text x="195" y="332" class="c" fill="#4b5563">Confira o número ou volte para suas senhas.</text>
<text x="195" y="358" class="m c" style="font-size:12px">HTTP 403 · Acesso negado</text>

<rect x="20" y="392" width="350" height="48" rx="8" fill="#2563eb"/>
<text x="195" y="422" class="bp">Voltar para minhas senhas</text>
<rect x="20" y="456" width="350" height="48" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="195" y="486" class="bs">Sair e entrar com outra conta</text>

<rect x="20" y="540" width="350" height="140" rx="10" fill="none" stroke="#6b7280" stroke-dasharray="6 4"/>
<text x="36" y="566" class="b" style="font-size:13px">Anotações para desenvolvimento (não exibidas)</text>
<text x="36" y="590" class="l">401: sessão expirada, ir ao login com aviso.</text>
<text x="36" y="612" class="l">Após o login, voltar à tela de origem.</text>
<text x="36" y="634" class="l">Câmera negada no QR Code (T-CID-04):</text>
<text x="36" y="656" class="l">mostrar só o campo de código digitado.</text>
</g>
</svg>
