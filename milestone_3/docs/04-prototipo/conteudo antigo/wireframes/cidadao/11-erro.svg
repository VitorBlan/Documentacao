<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="tt dd">
<title id="tt">T-CID-11 Erro ao emitir senha</title>
<desc id="dd">Estado de erro: mensagem devolvida pela API (formato CommonResponse: message, data, errors), código HTTP e ações de recuperação. Exemplo mostrado: 409 ao tentar segunda senha ativa na mesma fila.</desc>
<style>
.h{font-size:20px;font-weight:700}
.h18{font-size:18px;font-weight:700}
.b{font-weight:700}
.l{font-size:13px;fill:#4b5563}
.s{font-size:12px;fill:#4b5563}
.m{font-family:monospace;font-size:12px;fill:#4b5563}
.c{text-anchor:middle}
.bp{font-size:16px;font-weight:700;fill:#ffffff;text-anchor:middle}
.bs{font-size:16px;font-weight:700;fill:#111827;text-anchor:middle}
</style>
<rect width="390" height="844" fill="#ffffff"/>
<g font-family="sans-serif" font-size="15" fill="#111827">
<rect x="0" y="0" width="390" height="56" fill="#f3f4f6"/>
<line x1="0" y1="56" x2="390" y2="56" stroke="#d1d5db"/>
<path d="M26 18 L16 28 L26 38" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="35" class="h18">Emitir senha</text>
<rect x="20" y="88" width="350" height="150" rx="12" fill="#f3f4f6" stroke="#6b7280"/>
<path d="M44 112 L62 144 L26 144 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
<line x1="44" y1="122" x2="44" y2="132" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="44" cy="138" r="1.8" fill="#111827"/>
<text x="76" y="130" class="b">Não foi possível emitir sua senha</text>
<text x="36" y="168">Usuário já possui senha ativa</text>
<text x="36" y="190">nesta fila.</text>
<text x="36" y="222" class="m" style="font-size:12px">HTTP 409 · Conflito</text>

<rect x="20" y="262" width="350" height="48" rx="8" fill="#2563eb"/>
<text x="195" y="292" class="bp">Ver minha senha</text>
<rect x="20" y="322" width="350" height="48" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="195" y="352" class="bs">Voltar às filas</text>

<rect x="20" y="400" width="350" height="170" rx="10" fill="none" stroke="#6b7280" stroke-dasharray="6 4"/>
<text x="36" y="426" class="b" style="font-size:13px">Anotações para desenvolvimento (não exibidas)</text>
<text x="36" y="452" class="l">400  Fila inválida ou inativa.</text>
<text x="36" y="474" class="l">409  Usuário já possui senha ativa nesta fila.</text>
<text x="36" y="496" class="l">500  Erro interno: mostrar Tentar novamente.</text>
<text x="36" y="518" class="l">Falha de rede: mostrar Tentar novamente.</text>
<text x="36" y="540" class="l">401  Sessão expirada: ir ao login (T-CID-10).</text>
<text x="36" y="562" class="l">Mensagem vem de message; sem texto, usar padrão.</text>
</g>
</svg>
