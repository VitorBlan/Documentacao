<title id="tt">T-CID-01 Filas disponíveis</title>
<desc id="dd">Tela inicial do cidadão logado: filas ativas agrupadas por instituição, filtro por tipo de atendimento, busca e navegação inferior. Dados de GET /filas (com instituicao.nome) e contagem de GET /filas/:id/senhas/contagem.</desc>
