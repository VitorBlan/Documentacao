</style>
<rect width="1280" height="800" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="56" fill="#E6E8EC"/>
<line x1="0" y1="56" x2="1280" y2="56" class="sep"/>
<text x="20" y="35" class="logo">FilaCidadã</text>
<text x="1196" y="28" class="r bd">Ana Paula Ribeiro</text>
<text x="1196" y="45" class="m r">ADMIN_INSTITUICAO · UBS Vila Nova</text>
<circle cx="1232" cy="28" r="16" fill="#C9CDD3"/>
<text x="1232" y="33" class="av c">AP</text>
<rect x="0" y="57" width="220" height="743" class="side"/>
<line x1="220" y1="57" x2="220" y2="800" class="sep"/>
<text x="20" y="84" class="m bd">MENU</text>
<text x="26" y="120">Painel da instituição</text>
<line x1="12" y1="700" x2="208" y2="700" class="sep"/>
<text x="20" y="724" class="bd">UBS Vila Nova</text>
<text x="20" y="744" class="m">Fuso: America/Manaus</text>
<text x="244" y="88" class="m">Início / Solicitações</text>
<text x="244" y="116" class="h1">Solicitações de instituição</text>
<text x="244" y="138" class="mo">PATCH /instituicoes/:id/aprovar → 403</text>

<rect x="354" y="220" width="800" height="440" rx="8" class="card"/>
<rect x="728" y="290" width="52" height="40" rx="6" fill="#E6E8EC" stroke="#5F6670" stroke-width="2"/>
<path d="M740 290 V276 A14 14 0 0 1 768 276 V290" fill="none" stroke="#5F6670" stroke-width="4"/>
<text x="754" y="372" class="c" style="font-size:22px;font-weight:bold">Acesso negado</text>
<text x="754" y="404" class="c" style="font-size:14px">Aprovar, rejeitar e reconsiderar solicitações são exclusivos do ADMIN_PLATAFORMA.</text>
<text x="754" y="428" class="c m" style="font-size:13px">Seu perfil é ADMIN_INSTITUICAO. Solicitações de nova instituição não aparecem no seu painel.</text>
<rect x="404" y="456" width="700" height="76" rx="6" class="tag"/>
<text x="424" y="482" class="cd">HTTP 403 · Acesso negado: permissão insuficiente</text>
<text x="424" y="506" class="cd">Rota: PATCH /instituicoes/:id/aprovar (authorize: ADMIN_PLATAFORMA)</text>
<rect x="574" y="566" width="300" height="40" rx="6" class="bp"/>
<text x="724" y="591" class="bw c">Ir para o painel da instituição</text>
<text x="754" y="640" class="m c">Outras telas da plataforma seguem a mesma regra: o bloqueio vale na API, não só no menu.</text>
</svg>
