<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img">
<title>Editar fila</title>
<desc>Tela ADI-03: formulário de fila, com campos de tipo de atendimento, prioridades, QR Code, mesas e erro de validação de tempo de exibição.</desc>
<style>
text{font-family:sans-serif;font-size:13px;fill:#1F2328}
.m{font-size:12px;fill:#5F6670}
.mo{font-family:monospace;font-size:12px;fill:#5F6670}
.cd{font-family:monospace;font-size:12px;fill:#1F2328}
.logo{font-size:18px;font-weight:bold}
.h1{font-size:22px;font-weight:bold}
.h2{font-size:15px;font-weight:bold}
.bd{font-weight:bold}
.big{font-size:28px;font-weight:bold}
.bt{font-size:14px;font-weight:bold}
.bw{font-size:14px;font-weight:bold;fill:#FFFFFF}
.bg{font-size:14px;font-weight:bold;fill:#8A9099}
.tg{font-size:12px;font-weight:bold}
.tgA{font-size:12px;font-weight:bold;fill:#1F5FAD}
.av{font-size:12px;font-weight:bold}
.ac{fill:#1F5FAD;font-weight:bold}
.c{text-anchor:middle}
.r{text-anchor:end}
.card{fill:#FFFFFF;stroke:#C9CDD3}
.th{fill:#F3F4F6;stroke:#C9CDD3}
.side{fill:#F3F4F6}
.sep{stroke:#C9CDD3;stroke-width:1}
.ln{stroke:#E1E4E8;stroke-width:1}
.inp{fill:#FFFFFF;stroke:#9AA0A8}
.bp{fill:#1F5FAD}
.bs{fill:#FFFFFF;stroke:#9AA0A8}
.bx{fill:#E6E8EC;stroke:#C9CDD3}
.soft{fill:#E8F0FA;stroke:#1F5FAD}
.tag{fill:#E6E8EC;stroke:#C9CDD3}
.bar{fill:#AEB4BC}
.bar2{fill:#1F5FAD}
.trk{fill:#E6E8EC}
.on{fill:#1F5FAD}
.off{fill:#C9CDD3}
.kn{fill:#FFFFFF}
.ghost{fill:none;stroke:#9AA0A8;stroke-width:2;stroke-dasharray:6 6}
</style>
<rect width="1280" height="800" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="56" fill="#E6E8EC"/>
<line x1="0" y1="56" x2="1280" y2="56" class="sep"/>
<text x="20" y="35" class="logo">FilaCidadã</text>
<text x="1196" y="28" class="r bd">Ana Paula Ribeiro</text>
<text x="1196" y="45" class="m r">ADMIN_INSTITUICAO · UBS Vila Nova</text>
<circle cx="1232" cy="28" r="16" fill="#C9CDD3"/>
<text x="1232" y="33" class="av c">AP</text>
<rect x="0" y="57" width="220" height="743" class="side"/>
<line x1="220" y1="57" x2="220" y2="800" class="sep"/>
<text x="20" y="84" class="m bd">MENU</text>
<rect x="12" y="98" width="196" height="34" rx="6" class="soft"/>
<text x="26" y="120" class="ac">Filas</text>
<text x="26" y="160">Tipos de etapa</text>
<text x="26" y="200">Usuários e papéis</text>
<text x="26" y="240">QR Codes</text>
<text x="26" y="280">Auditoria</text>
<text x="26" y="320">Configuração</text>
<line x1="12" y1="700" x2="208" y2="700" class="sep"/>
<text x="20" y="724" class="bd">UBS Vila Nova</text>
<text x="20" y="744" class="m">Fuso: America/Manaus</text>
<text x="244" y="88" class="m">Início / Filas / Recepção Habilitação</text>
<text x="244" y="116" class="h1">Editar fila</text>
<text x="244" y="138" class="mo">PATCH /filas/:id</text>

<rect x="244" y="156" width="600" height="628" rx="8" class="card"/>
<text x="264" y="184" class="bd">Nome da fila *</text>
<rect x="264" y="190" width="560" height="36" rx="6" class="inp"/>
<text x="278" y="213">Recepção Habilitação</text>

<text x="264" y="250" class="bd">Tipo de atendimento *</text>
<circle cx="280" cy="280" r="8" class="inp"/>
<text x="296" y="285">ONLINE</text>
<circle cx="390" cy="280" r="8" class="inp"/>
<text x="406" y="285">PRESENCIAL</text>
<circle cx="512" cy="280" r="8" class="inp"/>
<circle cx="512" cy="280" r="4" class="on"/>
<text x="528" y="285">HIBRIDO</text>

<rect x="264" y="308" width="36" height="20" rx="10" class="on"/><circle cx="292" cy="318" r="8" class="kn"/>
<text x="312" y="323">Fila ativa</text>
<rect x="264" y="342" width="36" height="20" rx="10" class="on"/><circle cx="292" cy="352" r="8" class="kn"/>
<text x="312" y="357">Prioridades habilitadas (LEGAL)</text>
<rect x="264" y="376" width="36" height="20" rx="10" class="off"/><circle cx="276" cy="386" r="8" class="kn"/>
<text x="312" y="391">Fidelidade habilitada (FIDELIDADE)</text>
<line x1="264" y1="408" x2="824" y2="408" class="ln"/>

<text x="264" y="434" class="bd">Tempo máximo de atendimento (min)</text>
<rect x="264" y="442" width="268" height="36" rx="6" class="inp"/>
<text x="278" y="465">30</text>
<text x="556" y="434" class="bd">Tempo de alerta (s)</text>
<rect x="556" y="442" width="268" height="36" rx="6" class="inp"/>
<text x="570" y="465">30</text>
<text x="264" y="494" class="m">Opcional. Vazio = sem limite.</text>
<text x="556" y="494" class="m">Entre 5 e 120 segundos.</text>

<text x="264" y="530" class="h2">QR Code</text>
<line x1="264" y1="540" x2="824" y2="540" class="ln"/>
<text x="264" y="562" class="bd">Modo de QR Code *</text>
<rect x="264" y="570" width="268" height="36" rx="6" class="inp"/>
<text x="278" y="593">FIXO</text>
<text x="556" y="562" class="bd">Tempo de exibição (min) *</text>
<rect x="556" y="570" width="268" height="36" rx="6" class="inp" style="stroke:#1F2328;stroke-width:2"/>
<text x="570" y="593">75</text>
<text x="556" y="622" class="bd">Erro: valor entre 1 e 60.</text>

<text x="264" y="652" class="bd">Tempo de expiração (min)</text>
<rect x="264" y="660" width="268" height="36" rx="6" class="inp"/>
<text x="278" y="683">10</text>
<text x="264" y="708" class="m">Vazio: 2 × tempo de exibição</text>
<text x="556" y="652" class="bd">Tolerância (min)</text>
<rect x="556" y="660" width="268" height="36" rx="6" class="inp"/>
<text x="570" y="683">5</text>
<text x="556" y="708" class="m">Vazio: 1 × tempo de exibição</text>

<rect x="600" y="732" width="100" height="36" rx="6" class="bs"/>
<text x="650" y="755" class="bt c">Cancelar</text>
<rect x="716" y="732" width="108" height="36" rx="6" class="bp"/>
<text x="770" y="755" class="bw c">Salvar fila</text>

<rect x="860" y="156" width="404" height="300" rx="8" class="card"/>
<text x="878" y="182" class="h2">Mesas (estações)</text>
<text x="878" y="200" class="m">Número é único dentro da fila.</text>
<rect x="872" y="212" width="380" height="28" class="th"/>
<text x="884" y="231" class="bd">Número</text>
<text x="980" y="231" class="bd">Nome</text>
<text x="1206" y="231" class="bd">Ativa</text>
<text x="884" y="263">Estação 1</text><text x="980" y="263">Balcão 1</text><text x="1206" y="263">Sim</text>
<line x1="872" y1="276" x2="1252" y2="276" class="ln"/>
<text x="884" y="299">Estação 2</text><text x="980" y="299">Balcão 2</text><text x="1206" y="299">Sim</text>
<line x1="872" y1="312" x2="1252" y2="312" class="ln"/>
<text x="884" y="335">Estação 3</text><text x="980" y="335">Sala de triagem</text><text x="1206" y="335">Não</text>
<rect x="872" y="364" width="150" height="34" rx="6" class="bs"/>
<text x="947" y="386" class="bt c">Adicionar mesa</text>

<rect x="860" y="476" width="404" height="308" rx="8" class="card"/>
<text x="878" y="502" class="h2">Regras do QR Code</text>
<text x="878" y="530">Modo FIXO: validade de 10 anos.</text>
<text x="878" y="552">Tempo de exibição padrão: 5 min.</text>
<text x="878" y="574" class="m">Expiração e tolerância usam os múltiplos padrão quando vazias.</text>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F3F4F6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C9CDD3" stroke-width="3"/></pattern></defs>
<rect x="878" y="600" width="160" height="160" rx="6" fill="url(#hatch)" stroke="#9AA0A8"/>
<rect x="890" y="612" width="136" height="136" rx="4" fill="#FFFFFF" stroke="#9AA0A8"/>
<text x="958" y="676" class="m c">QR Code gerado</text>
<text x="958" y="692" class="m c">após salvar</text>
<text x="1056" y="630" class="bd">Pré-visualização</text>
<text x="1056" y="650" class="m">Código e validade aparecem</text>
<text x="1056" y="666" class="m">depois de salvar a fila.</text>
</svg>
