<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="tt dd">
<title id="tt">T-PUB-03 Cadastro</title>
<desc id="dd">Criação de conta do cidadão (BetterAuth sign-up/email: nome, e-mail, senha, fuso horário). Após o cadastro não há login automático (autoSignIn false): leva à tela de login com aviso.</desc>
<style>
.bp{font-size:16px;font-weight:700;fill:#ffffff;text-anchor:middle}
.bs{font-size:16px;font-weight:700;fill:#111827;text-anchor:middle}
.c{text-anchor:middle}
.l{font-size:13px;fill:#4b5563}
</style>
<rect width="1280" height="800" fill="#ffffff"/>
<g font-family="sans-serif" font-size="15" fill="#111827">
<rect x="0" y="0" width="560" height="800" fill="#f3f4f6"/>
<rect x="64" y="64" width="32" height="32" rx="8" fill="#2563eb"/>
<rect x="72" y="74" width="16" height="18" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
<text x="108" y="88" style="font-size:20px;font-weight:700">FilaCidadã</text>
<text x="64" y="236" style="font-size:36px;font-weight:700">Crie sua conta grátis</text>
<text x="64" y="276" fill="#4b5563" style="font-size:17px">Entre em filas, acompanhe sua posição e</text>
<text x="64" y="302" fill="#4b5563" style="font-size:17px">veja seu histórico de atendimentos.</text>
<circle cx="76" cy="352" r="12" fill="#dbeafe"/>
<path d="M70 352 L74 356 L82 347" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="358" style="font-size:16px">Entre na fila pelo app ou pelo QR Code.</text>
<circle cx="76" cy="396" r="12" fill="#dbeafe"/>
<path d="M70 396 L74 400 L82 391" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="402" style="font-size:16px">Acompanhe sua posição na fila.</text>
<circle cx="76" cy="440" r="12" fill="#dbeafe"/>
<path d="M70 440 L74 444 L82 435" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="446" style="font-size:16px">Histórico de atendimentos sempre à mão.</text>

<text x="1200" y="56" text-anchor="end" fill="#1d4ed8" class="l" style="font-size:15px">Já tenho conta</text>
<text x="640" y="170" style="font-size:28px;font-weight:700">Criar conta</text>
<text x="640" y="198" fill="#4b5563">Preencha os dados abaixo para começar.</text>

<text x="640" y="236" class="l">Nome completo</text>
<rect x="640" y="244" width="560" height="48" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="656" y="274" fill="#6b7280">Ex.: Mariana Souza</text>
<text x="640" y="314" class="l">E-mail</text>
<rect x="640" y="322" width="560" height="48" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="656" y="352" fill="#6b7280">voce@exemplo.com.br</text>
<text x="640" y="392" class="l">Senha</text>
<rect x="640" y="400" width="560" height="48" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="656" y="430" fill="#6b7280">••••••••</text>
<text x="1184" y="430" text-anchor="end" fill="#1d4ed8">Mostrar</text>
<text x="640" y="466" class="l">Mínimo de 8 caracteres.</text>
<text x="640" y="490" class="l">Confirmar senha</text>
<rect x="640" y="498" width="560" height="48" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="656" y="528" fill="#6b7280">Repita a senha</text>
<text x="640" y="574" class="l">Fuso horário</text>
<rect x="640" y="582" width="560" height="48" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="656" y="612">Manaus (UTC-4)</text>
<path d="M1172 604 L1178 610 L1184 604" fill="none" stroke="#6b7280" stroke-width="2"/>
<text x="640" y="648" class="l">Usado para exibir horários. Pode mudar depois no perfil.</text>

<rect x="640" y="676" width="560" height="52" rx="10" fill="#2563eb"/>
<text x="920" y="708" class="bp" style="font-size:18px">Criar conta grátis</text>
<text x="920" y="752" text-anchor="middle" class="l" style="font-size:15px">Já tem conta? Entrar</text>
</g>
</svg>
