<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="tt dd">
<title id="tt">T-PUB-02 Login</title>
<desc id="dd">Entrada do cidadão e dos operadores/administradores (BetterAuth sign-in/email, sessão em cookie e token bearer). Mostra o estado de erro de credenciais; o caminho de sucesso leva ao painel do papel.</desc>
<style>
.bp{font-size:16px;font-weight:700;fill:#ffffff;text-anchor:middle}
.bs{font-size:16px;font-weight:700;fill:#111827;text-anchor:middle}
.c{text-anchor:middle}
.l{font-size:13px;fill:#4b5563}
</style>
<rect width="1280" height="800" fill="#ffffff"/>
<g font-family="sans-serif" font-size="15" fill="#111827">
<rect x="0" y="0" width="560" height="800" fill="#f3f4f6"/>
<rect x="64" y="64" width="32" height="32" rx="8" fill="#2563eb"/>
<rect x="72" y="74" width="16" height="18" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
<text x="108" y="88" style="font-size:20px;font-weight:700">FilaCidadã</text>
<text x="64" y="236" style="font-size:36px;font-weight:700">Bem-vindo de volta</text>
<text x="64" y="276" fill="#4b5563" style="font-size:17px">Acompanhe suas filas e senhas em um só lugar.</text>

<text x="1200" y="56" text-anchor="end" fill="#1d4ed8" style="font-size:15px">Criar conta</text>
<text x="640" y="170" style="font-size:28px;font-weight:700">Entrar</text>
<text x="640" y="198" fill="#4b5563">Use o e-mail e a senha da sua conta.</text>

<rect x="640" y="220" width="560" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="664" cy="248" r="10" fill="none" stroke="#1d4ed8" stroke-width="2"/>
<line x1="664" y1="243" x2="664" y2="250" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
<circle cx="664" cy="254" r="1.3" fill="#1d4ed8"/>
<text x="684" y="254">E-mail ou senha inválidos. Confira os dados e tente de novo.</text>

<text x="640" y="304" class="l">E-mail</text>
<rect x="640" y="312" width="560" height="48" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="656" y="342">mariana.souza@exemplo.com.br</text>
<text x="640" y="382" class="l">Senha</text>
<text x="1200" y="382" text-anchor="end" fill="#1d4ed8" class="l" style="font-size:13px">Esqueci minha senha</text>
<rect x="640" y="390" width="560" height="48" rx="8" fill="#ffffff" stroke="#6b7280"/>
<text x="656" y="420" fill="#6b7280">••••••••</text>
<text x="1184" y="420" text-anchor="end" fill="#1d4ed8">Mostrar</text>

<rect x="640" y="470" width="560" height="52" rx="10" fill="#2563eb"/>
<text x="920" y="502" class="bp" style="font-size:18px">Entrar</text>
<line x1="640" y1="548" x2="1200" y2="548" stroke="#e5e7eb"/>
<rect x="896" y="538" width="48" height="20" fill="#ffffff"/>
<text x="920" y="553" text-anchor="middle" class="l">ou</text>
<rect x="640" y="572" width="560" height="52" rx="10" fill="#ffffff" stroke="#6b7280"/>
<text x="920" y="604" class="bs" style="font-size:18px">Criar conta grátis</text>
<text x="640" y="660" class="l">Após várias tentativas seguidas, o acesso fica bloqueado por um tempo.</text>
</g>
</svg>
