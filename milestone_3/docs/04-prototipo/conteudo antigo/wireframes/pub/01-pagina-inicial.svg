<text x="64" y="133" style="font-size:13px;font-weight:700;fill:#1e3a8a">A plataforma que transforma o atendimento presencial</text>
<text x="48" y="218" style="font-size:46px;font-weight:700">Filas organizadas.</text>
<text x="48" y="276" style="font-size:46px;font-weight:700">Clientes satisfeitos.</text>
<text x="48" y="330" fill="#4b5563" style="font-size:18px">O FilaCidadã é a plataforma que transforma o atendimento</text>
