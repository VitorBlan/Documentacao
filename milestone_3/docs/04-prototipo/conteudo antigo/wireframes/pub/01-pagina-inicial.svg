<desc id="dd">Primeira dobra da página pública do FilaCidadã: cabeçalho com entrada, hero, estatísticas, ilustração do acompanhamento e a sequência 'Como funciona'. Textos vindos de GET /landing-page (valores padrão de LandingPageService).</desc>
