<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
<title>Exceção: ação sem permissão para o operador (T-OPE-07)</title>
<desc>Operador tenta Assumir atendimento, ação exclusiva do administrador da instituição. A API responde 403 e a tela mostra a mensagem de acesso negado, com o código do erro e a ação Voltar ao painel.</desc>
<style>
.bg{fill:#f9fafb}.bar{fill:#1f2937}.side{fill:#ffffff}.ln{stroke:#d1d5db;stroke-width:1}.lt{stroke:#e5e7eb;stroke-width:1}.card{fill:#ffffff;stroke:#d1d5db;stroke-width:1}.rec{fill:#ffffff;stroke:#6b7280;stroke-width:1.5;stroke-dasharray:6 4}.thb{fill:#f3f4f6}.navact{fill:#e5e7eb}.pri{fill:#1d4ed8}.sec{fill:#ffffff;stroke:#6b7280;stroke-width:1}.dis{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1;stroke-dasharray:4 3}.bdg{fill:#e5e7eb}.inp{fill:#ffffff;stroke:#6b7280;stroke-width:1}.fund{fill:#f9fafb;stroke:#e5e7eb;stroke-width:1}.scrim{fill:#111827;fill-opacity:.45}.chev{fill:none;stroke:#374151;stroke-width:2}.ico{fill:none;stroke:#6b7280;stroke-width:3}.ring{fill:none;stroke:#6b7280;stroke-width:2}
.brand{font:700 18px sans-serif;fill:#ffffff}.topr{font:14px sans-serif;fill:#d1d5db}.nav{font:700 14px sans-serif;fill:#111827}.navt{font:14px sans-serif;fill:#374151}.h1{font:700 24px sans-serif;fill:#111827}.h2{font:700 16px sans-serif;fill:#111827}.h3{font:700 20px sans-serif;fill:#111827}.tx{font:14px sans-serif;fill:#1f2937}.tb{font:700 14px sans-serif;fill:#111827}.tc{font:13px sans-serif;fill:#1f2937}.tm{font:12px sans-serif;fill:#4b5563}.thx{font:700 13px sans-serif;fill:#374151}.btx{font:700 14px sans-serif;fill:#ffffff}.stx{font:700 14px sans-serif;fill:#1f2937}.dtx{font:14px sans-serif;fill:#6b7280}.bdt{font:700 12px sans-serif;fill:#374151}.num{font:700 26px sans-serif;fill:#111827}.big{font:700 32px sans-serif;fill:#111827}.huge{font:700 48px sans-serif;fill:#111827}.mono{font:13px monospace;fill:#1f2937}.monos{font:12px monospace;fill:#1f2937}.tag{font:12px monospace;fill:#4b5563}.ph{font:14px sans-serif;fill:#6b7280}
</style>
<rect class="bg" x="0" y="0" width="1280" height="800"/>
<rect class="bar" x="0" y="0" width="1280" height="56"/>
<text class="brand" x="24" y="35">FilaCidada</text>
<text class="topr" x="1256" y="35" text-anchor="end">Ana Souza · Operador · Prefeitura Exemplo</text>
<rect class="side" x="0" y="56" width="220" height="744"/>
<line class="ln" x1="220" y1="56" x2="220" y2="800"/>
<rect class="navact" x="12" y="76" width="196" height="40" rx="6"/>
<text class="nav" x="28" y="101">Painel de atendimento</text>
<text class="navt" x="28" y="141">Emitir senha presencial</text>
<text class="navt" x="28" y="181">Consultar senhas</text>
<text class="navt" x="28" y="221">Meu atendimento</text>
<text class="tm" x="28" y="740">Fila de trabalho</text>
<text class="navt" x="28" y="760">Atendimento Geral</text>

<text class="h1" x="252" y="112">Painel de atendimento</text>
<text class="tag" x="1244" y="112" text-anchor="end">T-OPE-07</text>
<text class="tm" x="252" y="132">Fila: Atendimento Geral · 14 aguardando</text>
<text class="tm" x="252" y="176">Ação tentada: Assumir atendimento da senha 041</text>

<rect class="card" x="412" y="240" width="672" height="320" rx="10"/>
<circle cx="748" cy="300" r="28" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<path class="ico" d="M740 300 V290 A8 8 0 0 1 756 290 V300"/>
<rect x="736" y="300" width="24" height="18" rx="3" fill="#6b7280"/>
<text class="h3" x="748" y="370" text-anchor="middle">Você não tem permissão para esta ação</text>
<text class="tx" x="748" y="400" text-anchor="middle">O perfil Operador pode chamar, rechamar e finalizar senhas.</text>
<text class="tm" x="748" y="422" text-anchor="middle">Assumir atendimento é exclusivo do administrador da instituição.</text>
<rect x="580" y="446" width="336" height="32" rx="6" fill="#f3f4f6"/>
<text class="monos" x="748" y="467" text-anchor="middle">403 · Acesso negado: permissão insuficiente</text>
<rect class="pri" x="648" y="500" width="200" height="40" rx="6"/>
<text class="btx" x="748" y="525" text-anchor="middle">Voltar ao painel</text>
</svg>
