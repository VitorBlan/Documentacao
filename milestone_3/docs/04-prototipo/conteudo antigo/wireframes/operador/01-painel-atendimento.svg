<title>Painel de atendimento do operador (T-OPE-01)</title>
<desc>Painel do operador com fila de espera da fila Atendimento Geral. A ação principal e Chamar próxima. Cada senha tem Chamar e Cancelar. O card da direita lista atendimento de outro operador com Rechamar e Assumir desabilitados.</desc>
