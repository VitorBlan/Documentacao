<title>Exceção: fila vazia no painel do operador (T-OPE-05)</title>
<desc>Painel do operador com a fila Atendimento Geral sem senhas aguardando. Chamar próxima fica desabilitado e a área da lista mostra estado vazio com a ação Emitir senha presencial.</desc>
<style>
