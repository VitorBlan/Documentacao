<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
<title>Emissão de senha presencial (T-OPE-03)</title>
<desc>Formulário para o operador emitir senha presencial: fila, nome opcional do cidadão e prioridade (Fidelidade desabilitada pois a fila não a habilita). Ao lado, a prévia do recibo com a ação Imprimir recibo.</desc>
<style>
.bg{fill:#f9fafb}.bar{fill:#1f2937}.side{fill:#ffffff}.ln{stroke:#d1d5db;stroke-width:1}.lt{stroke:#e5e7eb;stroke-width:1}.card{fill:#ffffff;stroke:#d1d5db;stroke-width:1}.rec{fill:#ffffff;stroke:#6b7280;stroke-width:1.5;stroke-dasharray:6 4}.thb{fill:#f3f4f6}.navact{fill:#e5e7eb}.pri{fill:#1d4ed8}.sec{fill:#ffffff;stroke:#6b7280;stroke-width:1}.dis{fill:#f3f4f6;stroke:#9ca3af;stroke-width:1;stroke-dasharray:4 3}.bdg{fill:#e5e7eb}.inp{fill:#ffffff;stroke:#6b7280;stroke-width:1}.fund{fill:#f9fafb;stroke:#e5e7eb;stroke-width:1}.scrim{fill:#111827;fill-opacity:.45}.chev{fill:none;stroke:#374151;stroke-width:2}.ico{fill:none;stroke:#6b7280;stroke-width:3}.ring{fill:none;stroke:#6b7280;stroke-width:2}
.brand{font:700 18px sans-serif;fill:#ffffff}.topr{font:14px sans-serif;fill:#d1d5db}.nav{font:700 14px sans-serif;fill:#111827}.navt{font:14px sans-serif;fill:#374151}.h1{font:700 24px sans-serif;fill:#111827}.h2{font:700 16px sans-serif;fill:#111827}.h3{font:700 20px sans-serif;fill:#111827}.tx{font:14px sans-serif;fill:#1f2937}.tb{font:700 14px sans-serif;fill:#111827}.tc{font:13px sans-serif;fill:#1f2937}.tm{font:12px sans-serif;fill:#4b5563}.thx{font:700 13px sans-serif;fill:#374151}.btx{font:700 14px sans-serif;fill:#ffffff}.stx{font:700 14px sans-serif;fill:#1f2937}.dtx{font:14px sans-serif;fill:#6b7280}.bdt{font:700 12px sans-serif;fill:#374151}.num{font:700 26px sans-serif;fill:#111827}.big{font:700 32px sans-serif;fill:#111827}.huge{font:700 48px sans-serif;fill:#111827}.mono{font:13px monospace;fill:#1f2937}.monos{font:12px monospace;fill:#1f2937}.tag{font:12px monospace;fill:#4b5563}.ph{font:14px sans-serif;fill:#6b7280}
</style>
<rect class="bg" x="0" y="0" width="1280" height="800"/>
<rect class="bar" x="0" y="0" width="1280" height="56"/>
<text class="brand" x="24" y="35">FilaCidada</text>
<text class="topr" x="1256" y="35" text-anchor="end">Ana Souza · Operador · Prefeitura Exemplo</text>
<rect class="side" x="0" y="56" width="220" height="744"/>
<line class="ln" x1="220" y1="56" x2="220" y2="800"/>
<rect class="navact" x="12" y="116" width="196" height="40" rx="6"/>
<text class="navt" x="28" y="101">Painel de atendimento</text>
<text class="nav" x="28" y="141">Emitir senha presencial</text>
<text class="navt" x="28" y="181">Consultar senhas</text>
<text class="navt" x="28" y="221">Meu atendimento</text>
<text class="tm" x="28" y="740">Fila de trabalho</text>
<text class="navt" x="28" y="760">Atendimento Geral</text>

<text class="h1" x="252" y="112">Emitir senha presencial</text>
<text class="tag" x="1244" y="112" text-anchor="end">T-OPE-03</text>
<text class="tm" x="252" y="132">Para cidadão sem celular. A senha entra na fila como AGUARDANDO.</text>

<rect class="card" x="252" y="152" width="520" height="480" rx="8"/>
<text class="tm" x="276" y="184">Fila de atendimento</text>
<rect class="inp" x="276" y="192" width="472" height="40" rx="6"/>
<text class="tx" x="292" y="217">Atendimento Geral</text>
<path class="chev" d="M716 210 l6 6 l6 -6"/>

<text class="tm" x="276" y="256">Nome do cidadão (opcional)</text>
<rect class="inp" x="276" y="264" width="472" height="40" rx="6"/>
<text class="ph" x="292" y="289">Se vazio, fica como Cidadão Presencial</text>

<text class="tm" x="276" y="328">Prioridade</text>
<circle cx="292" cy="360" r="9" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<circle cx="292" cy="360" r="4" fill="#1f2937"/>
<text class="tx" x="310" y="365">Normal</text>
<circle cx="392" cy="360" r="9" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text class="tx" x="410" y="365">Legal</text>
<circle cx="512" cy="360" r="9" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text class="dtx" x="530" y="365">Fidelidade</text>
<text class="tm" x="276" y="392">Fidelidade indisponível: a fila não habilita esta prioridade.</text>

<rect class="pri" x="276" y="424" width="180" height="44" rx="6"/>
<text class="btx" x="366" y="451" text-anchor="middle">Emitir senha</text>
<rect class="sec" x="472" y="424" width="120" height="44" rx="6"/>
<text class="stx" x="532" y="451" text-anchor="middle">Limpar</text>

<line class="lt" x1="276" y1="496" x2="772" y2="496"/>
<text class="tm" x="276" y="520">Só aparecem filas ativas da sua instituição.</text>
<text class="tm" x="276" y="540">Senha presencial não exige QR Code.</text>

<rect class="rec" x="800" y="152" width="444" height="300" rx="8"/>
<text class="tm" x="1022" y="186" text-anchor="middle">Recibo de senha</text>
<text class="tx" x="1022" y="212" text-anchor="middle">Atendimento Geral</text>
<text class="huge" x="1022" y="290" text-anchor="middle">051</text>
<text class="tx" x="1022" y="322" text-anchor="middle">Posição 7 na fila</text>
<text class="tm" x="1022" y="346" text-anchor="middle">Cidadão Presencial</text>
<text class="tm" x="1022" y="366" text-anchor="middle">Emitida por Ana Souza às 10:05</text>
<rect class="sec" x="920" y="392" width="204" height="40" rx="6"/>
<text class="stx" x="1022" y="417" text-anchor="middle">Imprimir recibo</text>

<rect class="card" x="800" y="476" width="444" height="156" rx="8"/>
<text class="h2" x="820" y="506">Validações do sistema</text>
<text class="tm" x="820" y="532">1. Fila ativa, senão erro 400: Fila inválida ou inativa.</text>
<text class="tm" x="820" y="554">2. Fila da sua instituição, senão erro 403.</text>
<text class="tm" x="820" y="576">3. Prioridade só vale se a fila habilitar; senão vira Normal.</text>
<text class="tm" x="820" y="598">4. Número da senha é único por instituição.</text>
</svg>
