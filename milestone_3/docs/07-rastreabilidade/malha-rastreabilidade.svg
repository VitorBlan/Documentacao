<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1150" width="1180" height="1150" role="img" font-family="sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Malha de rastreabilidade do Bancada: do requisito à tabela</title>
  <desc>Cadeia de oito elos usada na matriz de rastreabilidade: requisito, história, caso de uso, classe, sequência, atividade, tela e tabela. Exemplo concreto: RF-01, a partir da US-003 Cadastro do cliente. O elo de teste do modelo não existe porque o repositório não tem código.</desc>
  <defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
  <rect x="0" y="0" width="1180" height="1150" fill="#ffffff"/>
  <text x="50" y="44" font-size="22" font-weight="bold" fill="#1a1a1a">Malha de rastreabilidade: do requisito à tabela</text>
  <text x="50" y="74" font-size="15" fill="#4a4a4a">Cadeia de cada história. Exemplo: US-003 Cadastro do cliente, da RF-01.</text>
  <text x="50" y="104" font-size="14" font-weight="bold" fill="#4a4a4a">ELO DA CADEIA</text>
  <text x="475" y="104" font-size="14" font-weight="bold" fill="#4a4a4a">EXEMPLO CONCRETO (US-003)</text>
  <rect x="50" y="120" width="375" height="82" rx="6" fill="#f2f3f5" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="68" y="146" font-size="14" fill="#4a4a4a">1. REQUISITO</text>
  <text x="68" y="174" font-size="19" font-weight="bold" fill="#1f5fbf">RF-01 Atendimento</text>
  <line x1="427" y1="161.0" x2="475" y2="161.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="495" y="157.0" font-size="15" fill="#1a1a1a">A secretária autenticada atende o cliente e mantém o cadastro;</text>
  <text x="495" y="179.0" font-size="15" fill="#1a1a1a">CPF único por cliente (issue #4, requisitos-funcionais.md).</text>
  <line x1="237" y1="202" x2="237" y2="238" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#seta)"/>
  <rect x="50" y="240" width="375" height="82" rx="6" fill="#f2f3f5" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="68" y="266" font-size="14" fill="#4a4a4a">2. HISTÓRIA</text>
  <text x="68" y="294" font-size="19" font-weight="bold" fill="#1f5fbf">US-003 Cadastro do cliente</text>
  <line x1="427" y1="281.0" x2="475" y2="281.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="495" y="277.0" font-size="15" fill="#1a1a1a">Dois cenários Gherkin: cadastro válido e CPF já cadastrado</text>
  <text x="495" y="299.0" font-size="15" fill="#1a1a1a">(issue #7, historias-de-usuario.md).</text>
  <line x1="237" y1="322" x2="237" y2="358" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#seta)"/>
  <rect x="50" y="360" width="375" height="82" rx="6" fill="#f2f3f5" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="68" y="386" font-size="14" fill="#4a4a4a">3. CASO DE USO</text>
  <text x="68" y="414" font-size="19" font-weight="bold" fill="#1f5fbf">UC-001 Cadastro de cliente</text>
  <line x1="427" y1="401.0" x2="475" y2="401.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="495" y="397.0" font-size="15" fill="#1a1a1a">Ator Secretária; «include» Autenticação. Issue #54 e página</text>
  <text x="495" y="419.0" font-size="15" fill="#1a1a1a">"04 · Diagrama de Casos de Uso" do Figma.</text>
  <line x1="237" y1="442" x2="237" y2="478" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#seta)"/>
  <rect x="50" y="480" width="375" height="82" rx="6" fill="#f2f3f5" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="68" y="506" font-size="14" fill="#4a4a4a">4. CLASSE</text>
  <text x="68" y="534" font-size="19" font-weight="bold" fill="#1f5fbf">Pessoa, Cliente e Endereco</text>
  <line x1="427" y1="521.0" x2="475" y2="521.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="495" y="517.0" font-size="15" fill="#1a1a1a">Pessoa {abstract}: nome, cpf, telefone, email; Cliente: dataCadastro;</text>
  <text x="495" y="539.0" font-size="15" fill="#1a1a1a">Endereco: cep, logradouro, numero, bairro (página "05").</text>
  <line x1="237" y1="562" x2="237" y2="598" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#seta)"/>
  <rect x="50" y="600" width="375" height="82" rx="6" fill="#f2f3f5" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="68" y="626" font-size="14" fill="#4a4a4a">5. SEQUÊNCIA</text>
  <text x="68" y="654" font-size="19" font-weight="bold" fill="#1f5fbf">DS-001 | UC-001</text>
  <line x1="427" y1="641.0" x2="475" y2="641.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="495" y="637.0" font-size="15" fill="#1a1a1a">Diagrama da página "06 · Diagrama de Sequência" do Figma,</text>
  <text x="495" y="659.0" font-size="15" fill="#1a1a1a">issue #78.</text>
  <line x1="237" y1="682" x2="237" y2="718" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#seta)"/>
  <rect x="50" y="720" width="375" height="82" rx="6" fill="#f2f3f5" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="68" y="746" font-size="14" fill="#4a4a4a">6. ATIVIDADE</text>
  <text x="68" y="774" font-size="19" font-weight="bold" fill="#1f5fbf">DA-001 | DS-001</text>
  <line x1="427" y1="761.0" x2="475" y2="761.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="495" y="757.0" font-size="15" fill="#1a1a1a">Fluxo do cadastro na página "08 - Diagrama de Atividades e</text>
  <text x="495" y="779.0" font-size="15" fill="#1a1a1a">Estados", issue #100.</text>
  <line x1="237" y1="802" x2="237" y2="838" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#seta)"/>
  <rect x="50" y="840" width="375" height="82" rx="6" fill="#f2f3f5" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="68" y="866" font-size="14" fill="#4a4a4a">7. TELA</text>
  <text x="68" y="894" font-size="19" font-weight="bold" fill="#1f5fbf">Cadastro do cliente</text>
  <line x1="427" y1="881.0" x2="475" y2="881.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="495" y="877.0" font-size="15" fill="#1a1a1a">Quadros: cadastro, informações conflitantes (CPF repetido) e</text>
  <text x="495" y="899.0" font-size="15" fill="#1a1a1a">cliente cadastrado com sucesso (página "03 · Protótipo").</text>
  <line x1="237" y1="922" x2="237" y2="958" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#seta)"/>
  <rect x="50" y="960" width="375" height="82" rx="6" fill="#f2f3f5" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="68" y="986" font-size="14" fill="#4a4a4a">8. TABELA</text>
  <text x="68" y="1014" font-size="19" font-weight="bold" fill="#1f5fbf">pessoa</text>
  <line x1="427" y1="1001.0" x2="475" y2="1001.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="495" y="997.0" font-size="15" fill="#1a1a1a">pess_cpf com a chave única uk_pessoa_cpf garante o CPF único</text>
  <text x="495" y="1019.0" font-size="15" fill="#1a1a1a">(banco do Milestone 2).</text>
  <rect x="50" y="1070" width="375" height="40" rx="6" fill="#fff8e6" stroke="#b7791f" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="68" y="1095" font-size="15" fill="#1a1a1a">9. TESTE: não há (lacuna L-12)</text>
  <text x="495" y="1095" font-size="15" fill="#4a4a4a">O repositório não tem código da aplicação; o elo de teste fica vazio.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
